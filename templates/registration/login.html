{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · NetOps</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="login-body"><main class="login-card"><div class="brand login-brand"><span class="brand-mark"><span></span><span></span><span></span></span><span><strong>NETOPS</strong><small>COMMAND CENTER</small></span></div><p class="eyebrow">Secure operator access</p><h1>Welcome back.</h1><p class="muted">Sign in to manage and automate your network.</p>{% if form.errors %}<div class="alert error">Invalid username or password.</div>{% endif %}<form method="post" class="form-stack">{% csrf_token %}<div><label for="id_username">Username</label>{{ form.username }}</div><div><label for="id_password">Password</label>{{ form.password }}</div><button class="btn btn-primary btn-wide">Sign in →</button></form></main></body></html>
